name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-24.04
    # The gate below waits for the commit's own CI, which may take as long as the
    # slowest platform job.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify the tag points at a commit on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Wait for the complete CI of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/wait_for_ci.py --sha "$(git rev-parse HEAD)"

  publish:
    name: Publish the release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes

name: CI

on:
  push:
    branches: [main, agent/dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install formatter
        run: python -m pip install clang-format==23.1.1
      - name: Check source formatting
        run: python ci/check_format.py

  native:
    name: ${{ matrix.platform.name }} / ${{ matrix.config }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        platform:
          - name: Linux GCC
            runner: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux Clang
            runner: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macOS AppleClang
            runner: macos-15
            cc: clang
            cxx: clang++
          - name: Windows MSVC
            runner: windows-2025
            cc: cl
            cxx: cl
          - name: Windows clang-cl
            runner: windows-2025
            cc: clang-cl
            cxx: clang-cl
    env:
      CC: ${{ matrix.platform.cc }}
      CXX: ${{ matrix.platform.cxx }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up MSVC SDK and runtime
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Native jobs exercise the minimum supported CMake series. MSYS2 jobs
      # exercise the current package-manager version with the same entry point.
      - name: Install build tools
        run: python -m pip install cmake==3.26.4 ninja==1.13.2
      - name: Build and test static and shared packages
        run: python ci/check_build.py --config ${{ matrix.config }} --generator Ninja
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.platform.name }}-${{ matrix.config }}
          path: |
            _ci/**/CMakeFiles/CMakeConfigureLog.yaml
            _ci/**/CMakeFiles/CMakeError.log
            _ci/**/CMakeFiles/CMakeOutput.log
            _ci/**/Testing/Temporary/*
          if-no-files-found: ignore

  sanitizer:
    name: Linux Clang / current CMake / sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install current CMake and Ninja
        run: python -m pip install --upgrade cmake ninja
      - name: Build shared library with sanitizers
        run: python ci/check_build.py --config Debug --generator Ninja --linkage shared --cmake-flag=-DCMAKE_C_FLAGS=-fsanitize=address,undefined --cmake-flag=-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined --cmake-flag=-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined --cmake-flag=-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined

  msys2:
    name: Windows ${{ matrix.toolchain.environment }} / ${{ matrix.config }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        toolchain:
          - environment: UCRT64
            package: mingw-w64-ucrt-x86_64
            cc: gcc
            cxx: g++
          - environment: MINGW64
            package: mingw-w64-x86_64
            cc: gcc
            cxx: g++
          - environment: CLANG64
            package: mingw-w64-clang-x86_64
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.toolchain.environment }}
          path-type: strict
          update: true
          install: >-
            git
            ${{ matrix.toolchain.package }}-${{ matrix.toolchain.cc }}
            ${{ matrix.toolchain.package }}-cmake
            ${{ matrix.toolchain.package }}-ninja
            ${{ matrix.toolchain.package }}-python
      - name: Show selected compiler
        run: |
          command -v python cmake ninja "$CC" "$CXX"
          "$CXX" --version
      - name: Build and test static and shared packages
        run: python ci/check_build.py --config ${{ matrix.config }} --generator Ninja
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.toolchain.environment }}-${{ matrix.config }}
          path: |
            _ci/**/CMakeFiles/CMakeConfigureLog.yaml
            _ci/**/CMakeFiles/CMakeError.log
            _ci/**/CMakeFiles/CMakeOutput.log
            _ci/**/Testing/Temporary/*
          if-no-files-found: ignore

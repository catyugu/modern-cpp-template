name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request (or ref). Superseded PR runs are cancelled; runs on
# main are kept because they validate the branch that is already merged.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Read by check_build.py and by CPM itself; must stay in sync with the cache path.
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    strategy:
      fail-fast: false
      # One entry per verification responsibility, not per compiler x generator x
      # linkage combination: build scopes prove a toolchain, package scopes prove
      # the installed package contract.
      matrix:
        include:
          - name: Linux GCC / Debug / Makefiles / package static
            id: linux-gcc
            runner: ubuntu-24.04
            cc: gcc
            cxx: g++
            generator: Unix Makefiles
            config: Debug
            linkage: static
            scope: package
            cmake: '3.26.4'
          - name: Linux Clang / Release / Ninja / package shared
            id: linux-clang
            runner: ubuntu-24.04
            cc: clang
            cxx: clang++
            generator: Ninja
            config: Release
            linkage: shared
            scope: package
          - name: macOS AppleClang / Release / Xcode / build shared
            id: macos
            runner: macos-15
            cc: clang
            cxx: clang++
            generator: Xcode
            config: Release
            linkage: shared
            scope: build
          - name: Windows MSVC / Debug / Visual Studio / package static
            id: windows-vs
            runner: windows-2022
            cc: cl
            cxx: cl
            generator: Visual Studio 17 2022
            config: Debug
            linkage: static
            scope: package
          - name: Windows MSVC / Release / Ninja / package shared
            id: windows-ninja
            runner: windows-2025
            cc: cl
            cxx: cl
            generator: Ninja
            config: Release
            linkage: shared
            scope: package
    steps:
      - uses: actions/checkout@v5
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: ./.github/actions/setup-build-tools
        with:
          cmake: ${{ matrix.cmake }}
      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Verify ${{ matrix.scope }} (${{ matrix.linkage }}, ${{ matrix.config }})
        run: >-
          python .github/scripts/check_build.py
          --config ${{ matrix.config }}
          --generator "${{ matrix.generator }}"
          --linkage ${{ matrix.linkage }}
          --scope ${{ matrix.scope }}
      - uses: ./.github/actions/upload-failure-logs
        with:
          name: logs-${{ matrix.id }}

  sanitizer:
    name: Linux Clang / current CMake / sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install current CMake and Ninja
        run: python -m pip install --upgrade cmake ninja
      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Build and test with sanitizers
        run: >-
          python .github/scripts/check_build.py
          --scope build
          --linkage shared
          --config Debug
          --generator Ninja
          --cmake-flag=-DCMAKE_C_FLAGS=-fsanitize=address,undefined
          --cmake-flag=-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          --cmake-flag=-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          --cmake-flag=-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined

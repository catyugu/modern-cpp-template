name: CI

on:
  push:
    branches: [main, agent/dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install formatter
        run: python -m pip install clang-format==23.1.1
      - name: Check source formatting
        run: python ci/check_format.py

  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Explicit entries avoid an expensive Cartesian product. Exercise native
      # generators (Makefiles, Xcode, Visual Studio) as well as Ninja.
      matrix:
        include:
          - name: Linux GCC / Debug / Makefiles
            id: linux-gcc-debug
            runner: ubuntu-24.04
            cc: gcc
            cxx: g++
            generator: Unix Makefiles
            config: Debug
            cmake: '3.26.4'
            toolset: ''
          - name: Linux GCC / Release / Ninja
            id: linux-gcc-release
            runner: ubuntu-24.04
            cc: gcc
            cxx: g++
            generator: Ninja
            config: Release
            cmake: '3.26.4'
            toolset: ''
          - name: Linux Clang / Debug / Ninja
            id: linux-clang-debug
            runner: ubuntu-24.04
            cc: clang
            cxx: clang++
            generator: Ninja
            config: Debug
            cmake: '3.26.4'
            toolset: ''
          - name: macOS AppleClang / Debug / Ninja
            id: macos-debug
            runner: macos-15
            cc: clang
            cxx: clang++
            generator: Ninja
            config: Debug
            cmake: '3.26.4'
            toolset: ''
          - name: macOS AppleClang / Release / Xcode
            id: macos-xcode-release
            runner: macos-15
            cc: clang
            cxx: clang++
            generator: Xcode
            config: Release
            cmake: '3.31.6'
            toolset: ''
          - name: Windows MSVC / Debug / Visual Studio
            id: windows-msvc-vs-debug
            runner: windows-2022
            cc: cl
            cxx: cl
            generator: Visual Studio 17 2022
            config: Debug
            cmake: '3.26.4'
            toolset: ''
          - name: Windows MSVC / Release / Ninja
            id: windows-msvc-ninja-release
            runner: windows-2025
            cc: cl
            cxx: cl
            generator: Ninja
            config: Release
            cmake: '3.26.4'
            toolset: ''
          - name: Windows clang-cl / Debug / Ninja
            id: windows-clangcl-ninja-debug
            runner: windows-2025
            cc: clang-cl
            cxx: clang-cl
            generator: Ninja
            config: Debug
            cmake: '3.26.4'
            toolset: ''
          - name: Windows clang-cl / Release / Visual Studio
            id: windows-clangcl-vs-release
            runner: windows-2022
            cc: clang-cl
            cxx: clang-cl
            generator: Visual Studio 17 2022
            config: Release
            cmake: '3.26.4'
            toolset: '--toolset ClangCL'
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up MSVC SDK and runtime
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install cmake==${{ matrix.cmake }} ninja==1.13.2
      - name: Build, test, install, and consume packages
        run: python ci/check_build.py --config ${{ matrix.config }} --generator "${{ matrix.generator }}" ${{ matrix.toolset }}
      - name: Check dependency source selection and overrides
        if: matrix.id == 'linux-gcc-release'
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
        run: python ci/check_dependencies.py
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.id }}
          path: |
            _ci/**/CMakeFiles/CMakeConfigureLog.yaml
            _ci/**/CMakeFiles/CMakeError.log
            _ci/**/CMakeFiles/CMakeOutput.log
            _ci/**/Testing/Temporary/*
          if-no-files-found: ignore

  template-e2e:
    name: Fresh template / install / consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install cmake==3.26.4 ninja==1.13.2
      - name: Initialize and consume a freshly named project
        run: python ci/test_template.py

  sanitizer:
    name: Linux Clang / current CMake / sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install current CMake and Ninja
        run: python -m pip install --upgrade cmake ninja
      - name: Build shared library with sanitizers
        run: python ci/check_build.py --config Debug --generator Ninja --linkage shared --cmake-flag=-DCMAKE_C_FLAGS=-fsanitize=address,undefined --cmake-flag=-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined --cmake-flag=-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined --cmake-flag=-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined

  msys2:
    name: Windows ${{ matrix.environment }} / ${{ matrix.config }}
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      # Keep two distinct MinGW-family toolchains; MINGW64 overlaps UCRT64.
      matrix:
        include:
          - environment: UCRT64
            package: mingw-w64-ucrt-x86_64
            cc: gcc
            cxx: g++
            config: Release
          - environment: CLANG64
            package: mingw-w64-clang-x86_64
            cc: clang
            cxx: clang++
            config: Debug
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.environment }}
          path-type: strict
          update: true
          install: >-
            git
            ${{ matrix.package }}-${{ matrix.cc }}
            ${{ matrix.package }}-cmake
            ${{ matrix.package }}-ninja
            ${{ matrix.package }}-python
      - name: Show selected compiler
        run: |
          command -v python cmake ninja "$CC" "$CXX"
          "$CXX" --version
      - name: Build and test static and shared packages
        run: python ci/check_build.py --config ${{ matrix.config }} --generator Ninja
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.environment }}-${{ matrix.config }}
          path: |
            _ci/**/CMakeFiles/CMakeConfigureLog.yaml
            _ci/**/CMakeFiles/CMakeError.log
            _ci/**/CMakeFiles/CMakeOutput.log
            _ci/**/Testing/Temporary/*
          if-no-files-found: ignore

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The same steps are runnable locally: ci/run_checks.sh [format|library|superproject|all]
defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The PyPI wheel ships the official LLVM binary, so every runner formats
      # with the same version; a distro clang-format rewrites the tree differently.
      - name: Install clang-format
        run: |
          python3 -m pip install --user --break-system-packages --disable-pip-version-check clang-format==23.1.1
          echo "$(python3 -c "import sysconfig; print(sysconfig.get_path('scripts', 'posix_user'))")" >> "$GITHUB_PATH"

      - name: Check the formatting of the tracked sources
        run: ci/run_checks.sh format

  checks:
    name: checks (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release, Debug]
        exclude:
          # Debug is covered on the two toolchains that differ most; the matrix
          # would otherwise grow without adding a distinct code path.
          - os: macos-latest
            build_type: Debug
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
    steps:
      - uses: actions/checkout@v5

      # Builds and tests the library, installs it and runs a find_package consumer
      # against the installed package, then embeds the library in a superproject
      # (configured with author warnings as errors) and runs the parent executable
      # -- each for a static and a shared library.
      - name: Build, install and embed
        run: ci/run_checks.sh all

name: Set up build tools
description: Install Python, the pinned Ninja and an optional pinned CMake

inputs:
  cmake:
    description: CMake version to install; empty keeps the runner's CMake
    default: ""
  ninja:
    description: Ninja version to install; empty keeps the runner's Ninja
    default: "1.13.2"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install pinned build tools
      shell: bash
      env:
        CMAKE_VERSION: ${{ inputs.cmake }}
        NINJA_VERSION: ${{ inputs.ninja }}
      run: |
        [[ -z "$CMAKE_VERSION" ]] || python -m pip install "cmake==$CMAKE_VERSION"
        [[ -z "$NINJA_VERSION" ]] || python -m pip install "ninja==$NINJA_VERSION"
        cmake --version | head -n 1
        ninja --version
